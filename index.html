<!DOCTYPE html><!-- Netlify Content Performance Dashboard v2.0 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netlify Content Performance Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F3EE;--surface:#FFFFFF;--surface2:#EFEDE8;
  --ink:#1A1916;--ink2:#5C5A55;--ink3:#9B9890;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#1D9E75;
  --coral:#993C1D;--coral-light:#FAECE7;--coral-mid:#D85A30;
  --blue:#185FA5;--blue-light:#E6F1FB;--blue-mid:#378ADD;
  --amber:#854F0B;--amber-light:#FAEEDA;
  --purple:#3C3489;--purple-light:#EEEDFE;
  --border:rgba(26,25,22,0.10);--border-strong:rgba(26,25,22,0.18);
  --shadow:0 1px 3px rgba(26,25,22,0.06),0 4px 12px rgba(26,25,22,0.04);
  --header-bg:#1A1916;--header-ink:#F5F3EE;
  --radius:10px;--radius-sm:6px
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.6}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
/* AUTH */
#auth-screen{position:fixed;inset:0;z-index:10000;background:var(--header-bg);display:flex;align-items:center;justify-content:center}
#auth-screen.hidden{display:none}
.auth-card{background:#242320;border:1px solid rgba(245,243,238,0.1);border-radius:14px;padding:48px 40px;max-width:420px;width:90%;text-align:center}
.auth-logo{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;color:#F5F3EE;letter-spacing:-0.02em;margin-bottom:6px}
.auth-subtitle{font-size:12px;color:rgba(245,243,238,0.4);margin-bottom:36px;letter-spacing:0.04em;text-transform:uppercase}
.auth-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:12px 20px;background:#fff;color:#1A1916;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:opacity 0.15s}
.auth-btn:hover{opacity:0.9}.auth-btn:disabled{opacity:0.5;cursor:default}
.auth-btn svg{width:18px;height:18px;flex-shrink:0}
.auth-error{margin-top:16px;font-size:12px;color:#F09595;min-height:18px}
.auth-note{margin-top:20px;font-size:11px;color:rgba(245,243,238,0.25)}
/* HEADER */
header{background:var(--header-bg);color:var(--header-ink);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.header-left{display:flex;align-items:baseline;gap:14px}
.logo{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;letter-spacing:-0.02em}
.header-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:400;color:rgba(245,243,238,0.55);letter-spacing:0.06em;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#refresh-btn{background:rgba(245,243,238,0.1);border:1px solid rgba(245,243,238,0.18);color:var(--header-ink);padding:7px 16px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:background 0.15s}
#refresh-btn:hover{background:rgba(245,243,238,0.2)}#refresh-btn:disabled{opacity:0.4;cursor:default}
#last-updated{font-size:12px;color:rgba(245,243,238,0.38)}
.signout-btn{background:rgba(245,243,238,0.08);border:1px solid rgba(245,243,238,0.15);color:rgba(245,243,238,0.5);padding:6px 12px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all 0.15s}
.signout-btn:hover{background:rgba(245,243,238,0.15);color:var(--header-ink)}
/* TABS */
.tab-nav{display:flex;gap:2px;padding:0 32px;background:var(--header-bg);border-top:1px solid rgba(245,243,238,0.08);flex-wrap:wrap}
.tab-btn{font-family:'Syne',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;padding:10px 18px;border:none;background:transparent;color:rgba(245,243,238,0.4);cursor:pointer;border-bottom:2px solid transparent;transition:color 0.15s,border-color 0.15s}
.tab-btn:hover{color:rgba(245,243,238,0.7)}.tab-btn.active{color:var(--header-ink);border-bottom-color:var(--teal-mid)}
.tab-content{display:none}.tab-content.active{display:block;animation:fadeIn 0.25s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* MAIN */
main{padding:24px 32px;max-width:1500px;margin:0 auto}
#status-bar{padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:20px;display:none;align-items:center;gap:8px}
#status-bar.loading{display:flex;background:var(--blue-light);color:var(--blue)}
#status-bar.error{display:flex;background:var(--coral-light);color:var(--coral)}
#status-bar.warn{display:flex;background:var(--amber-light);color:var(--amber)}
.spinner{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
/* PERIOD TOGGLE */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;font-family:'Syne',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.03em;color:var(--ink2);padding:6px 16px;border-radius:999px;cursor:pointer;transition:all 0.15s}
.seg button.active{background:var(--ink);color:#fff}
.range-label{font-size:12px;color:var(--ink3)}
/* METRIC CARDS */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);transition:border-color 0.15s,box-shadow 0.15s}
.mcard:hover{border-color:var(--border-strong);box-shadow:0 2px 8px rgba(26,25,22,0.10)}
.mcard-label{font-size:10px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.mcard-value{font-family:'Syne',sans-serif;font-size:28px;font-weight:600;line-height:1;letter-spacing:-0.03em}
.mcard-value.teal{color:var(--teal)}.mcard-value.coral{color:var(--coral-mid)}.mcard-value.blue{color:var(--blue)}.mcard-value.ink{color:var(--ink)}
.mcard-sub{font-size:11px;color:var(--ink3);margin-top:5px}
.mcard-sub .up{color:var(--teal-mid);font-weight:500}
/* CHARTS */
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:1000px){.chart-row{grid-template-columns:1fr}}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.chart-card-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:600;margin-bottom:2px}
.chart-card-sub{font-size:10px;color:var(--ink3);margin-bottom:12px}
.chart-wrap{position:relative;width:100%;height:240px}
/* DEMOGRAPHICS */
.demo-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.demo-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.demo-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:600}
.demo-tabs{display:flex;gap:6px;flex-wrap:wrap}
.demo-tabs button{border:1px solid var(--border);background:var(--surface);font-family:'DM Sans',sans-serif;font-size:12px;color:var(--ink2);padding:5px 12px;border-radius:999px;cursor:pointer;transition:all 0.15s}
.demo-tabs button.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.demo-row{margin-bottom:12px}
.demo-row:last-child{margin-bottom:0}
.demo-row-top{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:4px}
.demo-row-label{color:var(--ink);font-weight:500}
.demo-row-pct{color:var(--ink2);font-variant-numeric:tabular-nums;flex-shrink:0}
.demo-bar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.demo-bar-fill{height:100%;background:var(--teal-mid);border-radius:4px}
/* TABLE */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-family:'Syne',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink3);padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface2)}
thead th.num{text-align:right}thead th.sortable{cursor:pointer;user-select:none}thead th.sortable:hover{color:var(--ink)}
.sort-ind{opacity:0.5;font-size:9px;margin-left:3px}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top}
tbody td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}tbody tr:hover{background:var(--surface2)}
.post-title{max-width:480px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-date{color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{padding:48px 24px;text-align:center;color:var(--ink3);font-size:13px}
/* ICP */
.icp-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.btn{background:var(--ink);color:#fff;border:none;border-radius:var(--radius-sm);padding:9px 16px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:opacity 0.15s}
.btn:hover{opacity:0.88}
.btn.danger{background:transparent;color:var(--coral);border:1px solid var(--coral-light);padding:5px 10px;font-size:12px}
.btn.danger:hover{background:var(--coral-light)}
.icp-list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.icp-list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surface2)}
.icp-list-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:600}
.icp-list-meta{font-size:11px;color:var(--ink3)}
.muted{color:var(--ink3)}
footer{text-align:center;padding:24px;font-size:11px;color:var(--ink3)}
.hint{background:var(--amber-light);color:var(--amber);border:1px solid rgba(133,79,11,0.18);border-radius:var(--radius);padding:14px 18px;font-size:13px;margin-bottom:20px}
.hint code{background:rgba(133,79,11,0.12);padding:1px 5px;border-radius:4px;font-size:12px}
/* ICP REPORT */
.section-divider{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:36px 0 18px;padding-top:26px;border-top:1px solid var(--border-strong)}
.section-divider h2{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;letter-spacing:-0.01em}
.section-divider .meta{font-size:11px;color:var(--ink3)}
.section-sub{font-family:'Syne',sans-serif;font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:0.05em;margin:22px 0 10px}
.summary-text{font-size:13px;color:var(--ink2);margin-bottom:14px;max-width:920px}
.pill{display:inline-block;font-family:'Syne',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.03em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.dev{background:var(--teal-light);color:var(--teal)}
.pill.biz{background:var(--amber-light);color:var(--amber)}
.pill.infl{background:var(--purple-light);color:var(--purple)}
.pill.build{background:var(--blue-light);color:var(--blue)}
.insights{list-style:none;display:grid;gap:8px}
.insights li{position:relative;padding:12px 14px 12px 40px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);font-size:13px;color:var(--ink)}
.insights li .num{position:absolute;left:14px;top:12px;font-family:'Syne',sans-serif;font-weight:700;color:var(--teal-mid);font-size:13px}
.role-cell{max-width:280px;color:var(--ink2)}
/* ENGAGEMENT BREAKDOWN */
.brk-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:700px){.brk-grid{grid-template-columns:1fr}}
.brk-total{font-family:'Syne',sans-serif;font-size:22px;font-weight:600;letter-spacing:-0.02em;margin-bottom:10px}
.brk-total span{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:400;color:var(--ink3);letter-spacing:0;margin-left:4px}
/* PERSON HEADER */
.person-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.person-name{font-family:'Syne',sans-serif;font-size:19px;font-weight:700;letter-spacing:-0.01em}
.person-role{font-size:12px;color:var(--ink3)}
/* LEADERBOARD (T-CHART) */
.lb-eyebrow{font-family:'Syne',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.lb-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.025em;margin-bottom:4px}
.lb-title .vs{color:var(--ink3);font-weight:500}
.lb-sub{font-size:12px;color:var(--ink2);margin-bottom:22px}
.lb-lede{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.lb-lede-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--teal-mid)}
.lb-lede-card.b{border-top-color:var(--blue-mid)}
.lb-lede-who{font-family:'Syne',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.lb-lede-card.b .lb-lede-who{color:var(--blue)}
.lb-lede-text{font-size:13px;color:var(--ink);line-height:1.55}
.lb-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
table.lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.lb th,table.lb td{padding:11px 18px;border-bottom:1px solid var(--border)}
table.lb tr:last-child td{border-bottom:none}
.lb-people th{background:var(--surface2);vertical-align:bottom}
.lb-people th.metric-col{width:34%}
.lb-person{display:flex;flex-direction:column;gap:3px;text-align:left}
.lb-person-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;letter-spacing:-0.01em;color:var(--ink);text-transform:none}
.lb-person-role{font-size:11px;font-weight:400;color:var(--ink3);text-transform:none;letter-spacing:0}
.lb-person-foll{font-family:'Syne',sans-serif;font-size:20px;font-weight:600;letter-spacing:-0.02em;margin-top:6px;display:flex;align-items:baseline;gap:8px;text-transform:none}
.lb-person-foll small{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:400;color:var(--ink3);letter-spacing:0}
.lb-chip{display:inline-block;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--teal-light);color:var(--teal);letter-spacing:0}
.lb-group td{background:var(--surface2);font-family:'Syne',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);padding-top:9px;padding-bottom:9px}
.lb-metric{font-size:13px;color:var(--ink)}
.lb-metric small{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
.lb-val{text-align:right;font-size:15px;color:var(--ink2);width:33%}
.lb-val.win{background:var(--teal-light);color:var(--teal);font-weight:600}
.lb-foot{font-size:11px;color:var(--ink3);margin-top:14px}
@media(max-width:700px){.lb-lede{grid-template-columns:1fr}table.lb th,table.lb td{padding:9px 12px}}
/* ICP LIST FILTER */
.icp-filter{flex:1;min-width:200px;max-width:320px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;background:var(--surface);color:var(--ink)}
.icp-scroll{max-height:520px;overflow:auto}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">Netlify × Virio</div>
    <div class="auth-subtitle">Content Performance Dashboard</div>
    <button class="auth-btn" id="google-signin-btn" onclick="signInWithGoogle()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-note">Access restricted to @netlify.com and @virio.ai accounts</div>
  </div>
</div>

<header>
  <div class="header-left">
    <span class="logo">Netlify</span>
    <span class="header-title">Content Performance Dashboard</span>
  </div>
  <div class="header-right">
    <span id="last-updated"></span>
    <button class="signout-btn" id="signout-btn" style="display:none" onclick="signOut()">Sign out</button>
    <button id="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>
</header>

<div class="tab-nav" id="tab-nav"></div>

<main>
  <div id="status-bar"></div>

  <!-- Per-person tabs (built by JS from PEOPLE) -->
  <div id="tab-mathias" class="tab-content active"></div>
  <div id="tab-mathias-posts" class="tab-content"></div>
  <div id="tab-rtl" class="tab-content"></div>
  <div id="tab-rtl-posts" class="tab-content"></div>

  <!-- Leaderboard: head-to-head T-chart -->
  <div id="tab-leaderboard" class="tab-content"></div>

  <!-- ICPs -->
  <div id="tab-icps" class="tab-content">
    <div class="icp-toolbar">
      <button class="btn" onclick="document.getElementById('icp-file').click()">+ Upload ICP CSV</button>
      <input type="file" id="icp-file" accept=".csv,text/csv" style="display:none" onchange="handleIcpUpload(event)">
      <input class="icp-filter" id="icp-filter" placeholder="Filter by name, company or role…" oninput="renderIcpLists()">
      <span class="muted" id="icp-status"></span>
    </div>
    <div id="icp-lists"></div>
  </div>
</main>

<footer id="footer-date"></footer>

<script>
const SUPABASE_URL  = 'https://ylplirptcybuzxnecsgp.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlscGxpcnB0Y3lidXp4bmVjc2dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1MDAwNjcsImV4cCI6MjA2NzA3NjA2N30.H7BnhxTNvZ8WnByos5P84M2f8qhthIRlt_5Whkwt1wg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } });
const ALLOWED_DOMAINS = ['netlify.com', 'virio.ai'];
const ICP_TABLE = 'netlify_icps';

// ═══════════════════════════════════════════════════════════════════
// DATA
//
// Everything below is baked into the repo, so a refresh is a GitHub push
// and nothing else — no external data store, no API keys.
//
// Each person has one or more REPORTS. A report is one LinkedIn
// "Aggregate Analytics" export: daily impressions / engagements / new
// followers, the discovery + engagement breakdown cards, audience and

// ── CONTINUOUS PERIOD ─────────────────────────────────────────────
// Joins consecutive reports into one span (Apr 13 - latest) so the
// overview can show the whole engagement to date, not just one export.
//
// Three things do NOT simply add up across exports, and are handled
// rather than fudged:
//   - Days no export covers (Jul 28-31) become null: they leave a flat
//     step in the cumulative charts instead of a false dip to zero.
//   - Members reached counts UNIQUE members, so summing two periods
//     double-counts anyone who saw posts in both. It is left null and
//     the Discovery card says so.
//   - Demographics are percentages of different populations, so the
//     newest report's are shown rather than an invented blend.
// A single export covering the whole span would carry all three exactly;
// drop one in as its own report and it takes precedence.
function daysBetween(a, b){ return Math.round((Date.parse(b+'T00:00:00Z') - Date.parse(a+'T00:00:00Z')) / 86400000); }
function mergeReports(reports, key, label, observed){
  const rs = [...reports].sort((x,y)=> x.start < y.start ? -1 : 1);
  const first = rs[0], last = rs[rs.length-1];
  const span = daysBetween(first.start, last.end) + 1;
  const impr = new Array(span).fill(null), eng = new Array(span).fill(null), fNew = new Array(span).fill(null);
  rs.forEach(r => {
    const off = daysBetween(first.start, r.start);
    (r.impr||[]).forEach((v,i)=> impr[off+i] = v);
    (r.eng ||[]).forEach((v,i)=> eng [off+i] = v);
    (r.fNew||[]).forEach((v,i)=> fNew[off+i] = v);
  });
  const addBrk = which => {
    const totals = {};
    rs.forEach(r => ((r.breakdown && r.breakdown[which] && r.breakdown[which].items) || [])
      .forEach(it => totals[it.label] = (totals[it.label]||0) + it.value));
    const items = Object.entries(totals).map(([label,value])=>({label,value}));
    return items.length ? { total: items.reduce((s,i)=>s+i.value,0), items } : null;
  };
  const postId = url => String(url).replace(/^.*-(?:share|ugcPost|activity)-(\d+)-.*$/, '$1');
  const posts = [];
  const seen = new Map();
  rs.forEach(r => (r.posts||[]).forEach(p => {
    // Slugs carry a urlPrefix; normalise to a full URL so one list can mix reports.
    const full = /^https?:\/\//.test(p[0]) ? p : [ (r.urlPrefix||'') + p[0], ...p.slice(1) ];
    const id = postId(full[0]), prev = seen.get(id);
    // The same post can appear in two exports with different windows of
    // impressions; keep the larger, which is the longer-observed figure.
    if (!prev) { seen.set(id, full); posts.push(full); }
    else if ((full[2]||0) > (prev[2]||0)) posts[posts.indexOf(prev)] = full, seen.set(id, full);
  }));
  const dailyImpr = impr.reduce((s,v)=>s+(v||0),0);
  const gapDays = impr.filter(v=>v===null).length;
  const o = observed || {};
  // Impressions and members reached for the whole span are taken from
  // LinkedIn's own full-range view where we have it, because the daily
  // exports miss the uncovered days and unique members never sum.
  const missing = (o.impressions != null) ? o.impressions - dailyImpr : null;
  return {
    key, label, src: 'LinkedIn exports (joined)', start: first.start, end: last.end,
    totFollowers: last.totFollowers,
    impr, eng, fNew,
    totals: { impressions: (o.impressions != null) ? o.impressions : dailyImpr, members: o.members ?? null },
    dailyImpr,
    gapNote: gapDays
      ? `Jul 28–31 (${gapDays} days) is covered by no daily export. Impressions and members reached come from LinkedIn's own ${first.start} – ${last.end} view and include those days${missing!=null?` — the ${missing.toLocaleString()} impressions missing from the daily curve`:''}. Engagements and new followers are summed from the daily files, so they still exclude them.`
      : null,
    discovery: {
      members: o.members ?? null,
      inNetwork: o.inNetwork || null,
      outOfNetwork: o.outOfNetwork || null,
      membersNote: (o.members == null)
        ? 'Members reached counts unique people, so it cannot be added across exports. Switch to a single report period to see it.'
        : 'Unique members who saw at least one post between ' + first.start + ' and ' + last.end + '.'
    },
    breakdown: { social: addBrk('social'), link: addBrk('link') },
    demo: last.demo, contentDemo: last.contentDemo,
    demoNote: 'from ' + last.label,
    gapDays,
    posts
  };
}

// ── FORMAT HELPERS ────────────────────────────────────────────────
function fmt(n){ if(n==null||isNaN(n))return '—'; const a=Math.abs(n); if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1)+'M'; if(a>=1e3)return (n/1e3).toFixed(a>=1e4?0:1)+'K'; return String(Math.round(n)); }
function fmtFull(n){ return n==null||isNaN(n) ? '—' : Number(n).toLocaleString(); }
function fmtPct(n){ return n==null||isNaN(n) ? '—' : n.toFixed(2)+'%'; }
function pctNum(s){ if(s==null)return 0; s=String(s).trim(); if(s.indexOf('<')>=0)return 0.5; const v=parseFloat(s.replace('%','')); return isNaN(v)?0:v; }
function addDays(iso,i){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(Date.UTC(y,m-1,d+i)); return dt.toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso)return '—'; const t=Date.parse(iso+(iso.length<=10?'T00:00:00Z':'')); return isNaN(t)?iso:new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}); }
function fmtDateShort(iso){ const t=Date.parse(iso+'T00:00:00Z'); return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}); }
function esc(s){ return s==null?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function setStatus(msg, kind){ const el=document.getElementById('status-bar'); el.className=kind||''; el.innerHTML = kind==='loading' ? '<span class="spinner"></span>'+msg : msg; }
const sum = a => (a||[]).reduce((x,y)=>x+(y||0),0);

// Post URLs come through as either a full URL (newer exports) or a slug
// that hangs off the report's urlPrefix (the Apr-Jul export).
function postUrl(rep, p){ return /^https?:\/\//.test(p[0]) ? p[0] : (rep.urlPrefix||'')+p[0]; }
// Post tuples are [slugOrUrl, date, impressions, engagements, title?]. The
// title is the post's own opening line, attached when the export was
// processed; without one we fall back to un-slugging the URL.
function postTitle(p){
  if (p[4]) return p[4];
  let s = String(p[0]).replace(/^https?:\/\/[^_]*_/,'').replace(/-(share|ugcPost|activity)-\d+-[\w-]+$/,'').replace(/-+/g,' ').trim();
  try { s = decodeURIComponent(s); } catch(_){}
  if (!s) return 'Untitled post';
  return s.charAt(0).toUpperCase()+s.slice(1) + '…';
}
function report(personKey){
  const p = PEOPLE[personKey];
  return p.reports.find(r => r.key === view[personKey].reportKey) || p.reports[0];
}
// Posts published inside the report window (LinkedIn's top-posts list also
// carries older posts that picked up impressions during the period).
function postsInPeriod(rep){
  return (rep.posts||[]).filter(p => p[1] >= rep.start && p[1] <= rep.end);
}

    `<button class="tab-btn ${t.id===activeTab?'active':''}" onclick="switchTab('${t.id}')">${esc(t.label)}</button>`).join('');
}
function switchTab(id){
  activeTab = id;
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  const el = document.getElementById('tab-'+id); if (el) el.classList.add('active');
  renderTabNav();
  if (id==='icps') loadIcps();
  else if (id==='leaderboard') renderLeaderboard();
  else if (id.endsWith('-posts')) renderPosts(id.replace('-posts',''));
  else renderOverview(id);
}

// ── OVERVIEW (one per person) ─────────────────────────────────────
function setReport(personKey, key){ view[personKey].reportKey = key; view[personKey].demoCat = null; renderOverview(personKey); }
function setWindow(personKey, w){ view[personKey].window = w; renderOverview(personKey); }
function setDemoCat(personKey, c){ view[personKey].demoCat = c; renderOverview(personKey); }

function renderOverview(personKey){
  const person = PEOPLE[personKey], v = view[personKey], rep = report(personKey);
  const host = document.getElementById('tab-'+personKey);
  const last7 = v.window === 'last7';
  const sIdx = last7 ? Math.max(0, rep.fNew.length-7) : 0;
  const slice = a => last7 ? (a||[]).slice(-7) : (a||[]);
  const impr = slice(rep.impr), eng = slice(rep.eng), fNew = slice(rep.fNew);
  const dailyImpr = sum(impr);
  const pImpr = (!last7 && rep.totals && rep.totals.impressions != null) ? rep.totals.impressions : dailyImpr;
  const pEng = sum(eng), pNewF = sum(fNew);
  const rate = pImpr ? (pEng/pImpr*100) : null;
  const growthPct = (rep.totFollowers-pNewF) > 0 ? (pNewF/(rep.totFollowers-pNewF)*100) : null;
  const startDate = addDays(rep.start, sIdx);
  const nPosts = postsInPeriod(rep).length;

  // Members reached and the engagement breakdown are period-level figures
  // from LinkedIn's own cards, so they only apply to the full window.
  const members = rep.discovery && rep.discovery.members;
  const showPeriodOnly = !last7;

  const periodSeg = person.reports.length > 1
    ? `<div class="seg">${person.reports.map(r=>`<button class="${r.key===v.reportKey?'active':''}" onclick="setReport('${personKey}','${r.key}')">${esc(r.label)}</button>`).join('')}</div>` : '';

  const cards = [
    { label:'Total Followers', value: fmtFull(rep.totFollowers), cls:'teal',
      sub: growthPct!=null ? `<span class="up">▲ ${pNewF.toLocaleString()}</span> new in this period (${growthPct.toFixed(1)}% growth)` : '' },
    { label:'Impressions', value: fmt(pImpr), cls:'blue', sub: fmtFull(pImpr) },
    { label:'Engagements', value: fmt(pEng), cls:'ink', sub:'reactions + comments + reposts' },
    { label:'Engagement Rate', value: fmtPct(rate), cls:'coral', sub:'engagements ÷ impressions' },
    { label:'Posts Published', value: showPeriodOnly ? fmtFull(nPosts) : '—', cls:'ink',
      sub: showPeriodOnly ? 'in this period' : 'full period only' },
    { label:'Members Reached', value: showPeriodOnly ? fmtFull(members) : '—', cls:'ink',
      sub: showPeriodOnly ? 'unique members, full period' : 'full period only' }
  ];

  host.innerHTML = `
    <div class="person-bar">
      <span class="person-name">${esc(person.name)}</span>
      <span class="person-role">${esc(person.role)} · <a href="${esc(person.profile)}" target="_blank" rel="noopener">LinkedIn profile</a></span>
    </div>
    <div class="toolbar">
      ${periodSeg}
      <div class="seg">
        <button class="${last7?'':'active'}" onclick="setWindow('${personKey}','full')">Full period</button>
        <button class="${last7?'active':''}" onclick="setWindow('${personKey}','last7')">Last 7 days</button>
      </div>
      <div class="range-label">${last7?'Last 7 days · ':''}${fmtDateShort(startDate)} – ${fmtDate(rep.end)}</div>
    </div>
    ${(!last7 && rep.gapNote) ? `<p class="lb-foot" style="margin:-8px 0 14px">${esc(rep.gapNote)}</p>` : ''}
    <div class="metric-grid">${cards.map(c=>`
      <div class="mcard"><div class="mcard-label">${c.label}</div><div class="mcard-value ${c.cls}">${c.value}</div>${c.sub?`<div class="mcard-sub">${c.sub}</div>`:''}</div>`).join('')}</div>
    <div class="chart-row">
      <div class="chart-card">
        <div class="chart-card-title">Follower Growth</div>
        <div class="chart-card-sub">Cumulative new followers over the period</div>
        <div class="chart-wrap"><canvas id="chart-followers-${personKey}"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">Impressions</div>
        <div class="chart-card-sub">Cumulative impressions over the period</div>
        <div class="chart-wrap"><canvas id="chart-impr-${personKey}"></canvas></div>
      </div>
    </div>
    <div class="chart-row">
      <div class="chart-card">
        <div class="chart-card-title">Engagements</div>
        <div class="chart-card-sub">Cumulative engagements (reactions + comments + reposts)</div>
        <div class="chart-wrap"><canvas id="chart-eng-${personKey}"></canvas></div>
      </div>
      <div class="demo-card">
        <div class="demo-head">
          <div class="demo-title">Top Demographics <span class="muted" style="font-weight:400">· followers${rep.demoNote?' · '+esc(rep.demoNote):''}</span></div>
          <div class="demo-tabs" id="demo-tabs-${personKey}"></div>
        </div>
        <div id="demo-body-${personKey}"></div>
      </div>
    </div>
    ${showPeriodOnly ? renderDiscovery(rep) : ''}
    ${showPeriodOnly ? renderEngBreakdown(rep) : ''}
    <div id="icp-report-${personKey}"></div>`;

  const labels = fNew.map((_,i)=>fmtDateShort(addDays(rep.start, sIdx+i)));
  const cum = a=>{ let s=0; return a.map(v=>s+=(v||0)); };
  drawLine('chart-followers-'+personKey, labels, cum(fNew), '#1D9E75');
  drawLine('chart-impr-'+personKey,      labels, cum(impr), '#378ADD');
  drawLine('chart-eng-'+personKey,       labels, cum(eng),  '#D85A30');

  renderDemoTabs(personKey, rep);
  renderIcpReport(personKey);
}

function renderDiscovery(rep){
  const d = rep.discovery; if(!d) return '';
  const net = (d.inNetwork!=null) ? `
      <div class="demo-row"><div class="demo-row-top"><span class="demo-row-label">In-network (followers and connections)</span><span class="demo-row-pct">${esc(d.inNetwork)}</span></div><div class="demo-bar"><div class="demo-bar-fill" style="width:${pctNum(d.inNetwork)}%"></div></div></div>
      <div class="demo-row"><div class="demo-row-top"><span class="demo-row-label">Out-of-network</span><span class="demo-row-pct">${esc(d.outOfNetwork)}</span></div><div class="demo-bar"><div class="demo-bar-fill" style="width:${pctNum(d.outOfNetwork)}%"></div></div></div>` : '';
  return `<div class="demo-card">
    <div class="demo-head"><div class="demo-title">Discovery <span class="muted" style="font-weight:400">· how the content was found</span></div></div>
    <div class="brk-grid">
      <div><div class="brk-total">${fmtFull(rep.totals?rep.totals.impressions:null)}<span>Impressions</span></div>${net}</div>
      <div><div class="brk-total">${fmtFull(d.members)}<span>Members reached</span></div>
        <div class="demo-row"><div class="demo-row-top"><span class="demo-row-label muted">${esc(d.membersNote || 'Unique members who saw at least one post in the period.')}</span></div></div></div>
    </div></div>`;
}
function renderEngBreakdown(rep){
  const e = rep.breakdown; if(!e) return '';
  const rows = list => (list||[]).map(it=>`<div class="demo-row"><div class="demo-row-top"><span class="demo-row-label">${esc(it.label)}</span><span class="demo-row-pct">${fmtFull(it.value)}</span></div></div>`).join('');
  const block = (g,title) => g ? `<div><div class="brk-total">${fmtFull(g.total)}<span>${title}</span></div>${rows(g.items)}</div>` : '';
  return `<div class="demo-card">
    <div class="demo-head"><div class="demo-title">Engagement Breakdown <span class="muted" style="font-weight:400">· ${esc(rep.label)}</span></div></div>
    <div class="brk-grid">${block(e.social,'Social engagements')}${block(e.link,'Link engagements')}</div>
  </div>`;
}
function drawLine(id, labels, data, color){
  if (charts[id]){ try{charts[id].destroy();}catch(_){} }
  const cv = document.getElementById(id); if(!cv) return;
  Chart.defaults.font.family="'DM Sans',sans-serif"; Chart.defaults.color='#5C5A55';
  charts[id]=new Chart(cv,{
    type:'line',
    data:{labels,datasets:[{data,borderColor:color,backgroundColor:color+'22',borderWidth:2,pointRadius:labels.length>20?0:2,fill:true,tension:0.3}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtFull(c.parsed.y)}}},
      scales:{x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:8,font:{size:9}}},y:{grid:{color:'rgba(26,25,22,0.07)'},beginAtZero:true,ticks:{font:{size:10},callback:v=>fmt(v)}}}}
  });
}
function renderDemoTabs(personKey, rep){
  const host = document.getElementById('demo-tabs-'+personKey); if(!host||!rep.demo) return;
  const cats = Object.keys(rep.demo);
  const order = ['Job title','Seniority','Industry','Location','Company size','Company'];
  cats.sort((a,b)=>{ const ia=order.indexOf(a), ib=order.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); });
  let cat = view[personKey].demoCat;
  if (!cat || !cats.includes(cat)) cat = view[personKey].demoCat = cats[0];
  host.innerHTML = cats.map(c=>`<button class="${c===cat?'active':''}" onclick="setDemoCat('${personKey}','${esc(c)}')">${esc(c)}</button>`).join('');
  const items = rep.demo[cat]||[];
  const max = Math.max(1, ...items.map(it=>pctNum(it[1])));
  document.getElementById('demo-body-'+personKey).innerHTML = items.map(it=>{
    const w = Math.max(2, pctNum(it[1])/max*100);
    return `<div class="demo-row"><div class="demo-row-top"><span class="demo-row-label">${esc(it[0])}</span><span class="demo-row-pct">${esc(it[1])}</span></div><div class="demo-bar"><div class="demo-bar-fill" style="width:${w}%"></div></div></div>`;
  }).join('') || '<div class="empty">No data</div>';
}

// ── ICP ENGAGEMENT REPORT ─────────────────────────────────────────
function personaClass(name){
  const c=(name||'').toLowerCase();
  if(/dev|engineer|architect/.test(c)) return 'dev';
  if(/cmo|business|cro|gtm|sales|success/.test(c)) return 'biz';
  if(/build/.test(c)) return 'build';
  return 'infl';
}
function renderIcpReport(personKey){
  const host=document.getElementById('icp-report-'+personKey); if(!host) return;
  const R = PEOPLE[personKey].icp;
  if(!R){ host.innerHTML = `<div class="section-divider"><h2>ICP Engagement Report</h2></div><div class="empty">No ICP report loaded yet.</div>`; return; }

  const sumCards = R.summary.metrics.map(m=>
    `<div class="mcard"><div class="mcard-label">${esc(m.label)}</div><div class="mcard-value ink">${fmtFull(m.count)}</div><div class="mcard-sub">${esc(m.share)} of engagers</div></div>`).join('');

  const maxEng = Math.max(1, ...R.personas.map(p=>p.engagers));
  const personaRows = R.personas.map(p=>{
    const w=Math.max(2, p.engagers/maxEng*100);
    return `<div class="demo-row"><div class="demo-row-top"><span class="demo-row-label">${esc(p.name)}</span><span class="demo-row-pct">${fmtFull(p.engagers)} engagers · ${esc(p.pct)} of ICP</span></div><div class="demo-bar"><div class="demo-bar-fill" style="width:${w}%"></div></div></div>`;
  }).join('');

  const engagers = R.topEngagers||[];   // Netlify staff are already excluded upstream, in the report itself
  const engRows = engagers.map(e=>`<tr><td>${esc(e.name)}</td><td class="role-cell">${esc(e.role)}</td><td>${esc(e.company)}</td><td><span class="pill ${personaClass(e.persona)}">${esc(e.persona)}</span></td><td class="num">${fmtFull(e.eng)}</td><td class="num">${fmtFull(e.posts)}</td></tr>`).join('')
    || `<tr><td colspan="6"><div class="empty">No ICP engagers.</div></td></tr>`;

  let breakdown = '';
  if (R.topics){
    breakdown = `
      <div class="section-sub">Topic Performance</div>
      <div class="table-card"><div class="table-wrap"><table>
        <thead><tr><th>Topic</th><th class="num">Posts</th><th class="num">Total eng.</th><th class="num">ICP eng.</th><th class="num">ICP rate</th></tr></thead>
        <tbody>${R.topics.map(t=>`<tr><td>${esc(t.name)}</td><td class="num">${fmtFull(t.posts)}</td><td class="num">${fmtFull(t.totalEng)}</td><td class="num">${fmtFull(t.icpEng)}</td><td class="num">${esc(t.icpRate)}</td></tr>`).join('')}</tbody>
      </table></div></div>`;
  } else if (R.postAnalysis){
    breakdown = `
      <div class="section-sub">Post-by-Post Analysis</div>
      <div class="table-card"><div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Topic</th><th class="num">Total eng.</th><th class="num">ICP eng.</th><th class="num">ICP rate</th></tr></thead>
        <tbody>${R.postAnalysis.map(t=>`<tr><td class="post-date">${fmtDate(t.date)}</td><td>${esc(t.topic)}</td><td class="num">${fmtFull(t.totalEng)}</td><td class="num">${fmtFull(t.icpEng)}</td><td class="num">${esc(t.icpRate)}</td></tr>`).join('')}</tbody>
      </table></div></div>`;
  }

  const insightItems = (R.contentInsights||[]).map((t,i)=>`<li><span class="num">${i+1}</span>${esc(t)}</li>`).join('');

  host.innerHTML = `
    <div class="section-divider">
      <h2>ICP Engagement Report</h2>
      <span class="meta">${esc(R.subject)} · ${R.posts} posts · ${fmtDate(R.periodStart)} – ${fmtDate(R.periodEnd)} · prepared ${fmtDate(R.prepared)}</span>
    </div>
    <div class="section-sub">Summary</div>
    <p class="summary-text">${esc(R.summary.text)}</p>
    <div class="metric-grid">${sumCards}</div>
    <div class="section-sub">Persona Breakdown</div>
    <div class="demo-card">${personaRows}</div>
    <div class="section-sub">Top ICP Engagers <span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">· ${engagers.length} shown, sorted by engagements · Netlify staff already excluded · full list on the ICPs tab</span></div>
    <div class="table-card"><div class="table-wrap"><table>
      <thead><tr><th>Name</th><th>Role</th><th>Company</th><th>Persona</th><th class="num">Eng</th><th class="num">Posts</th></tr></thead>
      <tbody>${engRows}</tbody>
    </table></div></div>
    ${breakdown}
    <div class="section-sub">Content Insights</div>
    <ul class="insights">${insightItems}</ul>`;
}

// ── BY POST (one per person) ──────────────────────────────────────
const POST_COLS = [
  { key:'date',  label:'Date',        num:false, get:p=>p[1] },
  { key:'title', label:'Post',        num:false, get:p=>p[0] },
  { key:'impr',  label:'Impressions', num:true,  get:p=>p[2]||0 },
  { key:'eng',   label:'Engagements', num:true,  get:p=>p[3]||0 },
  { key:'rate',  label:'Eng. Rate',   num:true,  get:p=>(p[2]&&p[3])?p[3]/p[2]*100:0 }
];
function sortPosts(personKey, col){
  const s = view[personKey].sort;
  if (s.col===col) s.dir = s.dir==='asc'?'desc':'asc'; else { s.col=col; s.dir = col==='title'?'asc':'desc'; }
  renderPosts(personKey);
}
function renderPosts(personKey){
  const person = PEOPLE[personKey], v = view[personKey], rep = report(personKey);
  const host = document.getElementById('tab-'+personKey+'-posts');
  const inPeriod = postsInPeriod(rep), carried = (rep.posts||[]).length - inPeriod.length;

  const periodSeg = person.reports.length > 1
    ? `<div class="seg">${person.reports.map(r=>`<button class="${r.key===v.reportKey?'active':''}" onclick="setPostsReport('${personKey}','${r.key}')">${esc(r.label)}</button>`).join('')}</div>` : '';

  const head = POST_COLS.map(c=>{
    const active=v.sort.col===c.key; const ind=!active?'⇅':v.sort.dir==='asc'?'▲':'▼';
    return `<th class="sortable ${c.num?'num':''}" onclick="sortPosts('${personKey}','${c.key}')">${c.label}<span class="sort-ind">${ind}</span></th>`;
  }).join('');

  const col = POST_COLS.find(c=>c.key===v.sort.col);
  const sorted = [...(rep.posts||[])].sort((a,b)=>{
    let av=col.get(a), bv=col.get(b);
    if (v.sort.col==='date'){ av=Date.parse(av)||0; bv=Date.parse(bv)||0; }
    if (typeof av==='string') return v.sort.dir==='asc'?av.localeCompare(bv):bv.localeCompare(av);
    return v.sort.dir==='asc'?av-bv:bv-av;
  });
  const body = sorted.map(p=>{
    const outside = !(p[1] >= rep.start && p[1] <= rep.end);
    return `<tr>
      <td><span class="post-date">${fmtDate(p[1])}</span>${outside?' <span class="muted" style="font-size:11px">· earlier post</span>':''}</td>
      <td><a class="post-title" href="${esc(postUrl(rep,p))}" target="_blank" rel="noopener">${esc(postTitle(p))}</a></td>
      <td class="num">${fmtFull(p[2])}</td>
      <td class="num">${fmtFull(p[3])}</td>
      <td class="num">${(p[2]&&p[3]!=null)?fmtPct(p[3]/p[2]*100):'—'}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="${POST_COLS.length}"><div class="empty">No posts in this period.</div></td></tr>`;

  host.innerHTML = `
    <div class="person-bar">
      <span class="person-name">${esc(person.name)}</span>
      <span class="person-role">Top-performing LinkedIn posts · ${esc(rep.label)}</span>
    </div>
    <div class="toolbar">
      ${periodSeg}
      <div class="range-label">${inPeriod.length} published in the period${carried?` · ${carried} earlier ${carried===1?'post':'posts'} that still drew impressions`:''}</div>
    </div>
    <div class="table-card"><div class="table-wrap">
      <table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
    </div></div>
    <p class="lb-foot">LinkedIn caps each export at the top 50 posts by engagements and the top 50 by impressions; a post that made only one of those lists shows “—” for the other metric.</p>`;
}
function setPostsReport(personKey, key){ view[personKey].reportKey = key; renderPosts(personKey); }

// ── LEADERBOARD (head-to-head T-chart) ────────────────────────────
// Compares the two people over the most recent period they BOTH have a
// report for, so every row is like-for-like out of the same LinkedIn export.
function commonReport(){
  const a = PEOPLE.mathias.reports, b = PEOPLE.rtl.reports;
  for (const ra of a){ const rb = b.find(r=>r.key===ra.key); if (rb) return [ra, rb]; }
  return null;
}
function renderLeaderboard(){
  const host = document.getElementById('tab-leaderboard');
  const pair = commonReport();
  if (!pair){ host.innerHTML = `<div class="empty">No period is covered by a report for both people yet.</div>`; return; }
  const [A, B] = pair;              // A = Mathias, B = Richard
  const pa = PEOPLE.mathias, pb = PEOPLE.rtl;

  const brk = r => { const o={}; ((r.breakdown&&r.breakdown.social&&r.breakdown.social.items)||[]).forEach(i=>o[i.label]=i.value); return o; };
  const ba = brk(A), bb = brk(B);
  const nA = postsInPeriod(A).length, nB = postsInPeriod(B).length;
  const fA = sum(A.fNew), fB = sum(B.fNew);
  const iA = A.totals.impressions, iB = B.totals.impressions;
  const eA = A.breakdown.social.total, eB = B.breakdown.social.total;
  const topA = Math.max(0, ...(A.posts||[]).filter(p=>p[1]>=A.start&&p[1]<=A.end).map(p=>p[2]||0));
  const topB = Math.max(0, ...(B.posts||[]).filter(p=>p[1]>=B.start&&p[1]<=B.end).map(p=>p[2]||0));
  const grow = (r,f) => (r.totFollowers-f) > 0 ? f/(r.totFollowers-f)*100 : null;

  // higher: 1 = bigger number wins, 0 = no winner marked
  const ROWS = [
    { group:'Growth' },
    { label:'New followers',        note:'gained over the period',        a:fA, b:fB, f:fmtFull },
    { label:'Growth rate',          note:'new followers ÷ starting base', a:grow(A,fA), b:grow(B,fB), f:v=>v==null?'—':v.toFixed(1)+'%' },
    { label:'Posts published',      note:'in the period',                 a:nA, b:nB, f:fmtFull },
    { group:'Engagement' },
    { label:'Reactions',            a:ba['Reactions'],        b:bb['Reactions'],        f:fmtFull },
    { label:'Comments',             a:ba['Comments'],         b:bb['Comments'],         f:fmtFull },
    { label:'Reposts',              a:ba['Reposts'],          b:bb['Reposts'],          f:fmtFull },
    { label:'Saves',                note:'we love the saves', a:ba['Saves'], b:bb['Saves'], f:fmtFull },
    { label:'Sends on LinkedIn',    note:'shared privately, person to person', a:ba['Sends on LinkedIn'], b:bb['Sends on LinkedIn'], f:fmtFull },
    { label:'Total engagements',    note:'all social engagements',        a:eA, b:eB, f:fmtFull },
    { label:'Engagements per post', a:nA?eA/nA:null, b:nB?eB/nB:null, f:v=>v==null?'—':v.toFixed(1) },
    { group:'Reach' },
    { label:'Impressions',          a:iA, b:iB, f:fmtFull },
    { label:'Members reached',      note:'unique members',                a:A.discovery.members, b:B.discovery.members, f:fmtFull },
    { label:'Impressions per post', a:nA?iA/nA:null, b:nB?iB/nB:null, f:v=>v==null?'—':fmtFull(Math.round(v)) },
    { label:'Engagement rate',      note:'engagements ÷ impressions',     a:iA?eA/iA*100:null, b:iB?eB/iB*100:null, f:v=>v==null?'—':v.toFixed(2)+'%' },
    { label:'Biggest single post',  note:'impressions on one post',       a:topA, b:topB, f:fmtFull }
  ];

  const body = ROWS.map(r=>{
    if (r.group) return `<tr class="lb-group"><td colspan="3">${esc(r.group)}</td></tr>`;
    const aw = (r.a!=null && r.b!=null && r.a > r.b), bw = (r.a!=null && r.b!=null && r.b > r.a);
    return `<tr>
      <td class="lb-metric">${esc(r.label)}${r.note?`<small>${esc(r.note)}</small>`:''}</td>
      <td class="lb-val ${aw?'win':''}">${r.f(r.a)}</td>
      <td class="lb-val ${bw?'win':''}">${r.f(r.b)}</td>
    </tr>`;
  }).join('');

  const card = (p, rep, gained, cls) => `
    <th class="lb-val" style="text-align:left">
      <div class="lb-person">
        <span class="lb-person-name">${esc(p.name)}</span>
        <span class="lb-person-role">${esc(p.role)}</span>
        <span class="lb-person-foll">${fmtFull(rep.totFollowers)} <small>followers</small> <span class="lb-chip">▲ ${fmtFull(gained)}</span></span>
      </div>
    </th>`;

  const ratio = (x,y) => y ? (x/y).toFixed(1)+'×' : '—';
  host.innerHTML = `
    <div class="lb-eyebrow">Netlify × Virio · Head to head</div>
    <div class="lb-title">${esc(pa.short)} <span class="vs">vs</span> ${esc(pb.short)} <span class="vs">· ${esc(A.label)}</span></div>
    <div class="lb-sub">Both columns come from each person's own LinkedIn analytics export for ${fmtDate(A.start)} – ${fmtDate(A.end)}, so every row is like-for-like.</div>

    <div class="lb-lede">
      <div class="lb-lede-card">
        <div class="lb-lede-who">${esc(pa.short)} leads on volume and reach</div>
        <div class="lb-lede-text">${fmtFull(iA)} impressions (${ratio(iA,iB)} Richard's) and ${fmtFull(eA)} engagements across ${nA} posts, plus ${fmtFull(fA)} new followers — ${ratio(fA,fB)} Richard's follower growth on roughly half the base.</div>
      </div>
      <div class="lb-lede-card b">
        <div class="lb-lede-who">${esc(pb.short)} leads on audience size and the month's biggest post</div>
        <div class="lb-lede-text">${fmtFull(B.totFollowers)} followers — ${ratio(B.totFollowers,A.totFollowers)} Mathias's — and the single biggest post of the month at ${fmtFull(topB)} impressions, from ${nB} posts in his first full month of publishing.</div>
      </div>
    </div>

    <div class="lb-card"><table class="lb">
      <thead><tr class="lb-people">
        <th class="metric-col"></th>
        ${card(pa, A, fA)}
        ${card(pb, B, fB)}
      </tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    <p class="lb-foot">Highlighted cell = category leader · data ${fmtDate(A.start)} – ${fmtDate(A.end)} · source: LinkedIn analytics exports for each profile.</p>`;
}

// ── ICPs TAB ──────────────────────────────────────────────────────
// Two sources: the per-person ICP engager lists committed under /data
// (loaded on first visit), and any CSV uploaded here, which is stored in
// Supabase so it is shared with everyone who opens the dashboard.
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for (let i=0;i<text.length;i++){ const ch=text[i];
    if (q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"')q=true; else if(ch===','){row.push(cur);cur='';} else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(ch==='\r'){} else cur+=ch; }
  }
  if (cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function gridToList(grid){
  const headers = grid[0].map(h=>h.trim());
  const rows = grid.slice(1).map(r=>{ const o={}; headers.forEach((h,i)=>o[h]=(r[i]||'').trim()); return o; });
  return { columns:headers, rows };
}
let BUILTIN_ICPS = null;   // [{id, name, meta, columns, rows, href}]
let UPLOADED_ICPS = [];
let ICP_DATA = {};         // id -> list, for CSV download

async function loadBuiltinIcps(){
  if (BUILTIN_ICPS) return BUILTIN_ICPS;
  BUILTIN_ICPS = [];
  for (const key of PERSON_KEYS){
    const p = PEOPLE[key], f = p.icpFile; if (!f) continue;
    try {
      const res = await fetch(f.path, { cache:'no-cache' });
      if (!res.ok) throw new Error('HTTP '+res.status);
      const grid = parseCSV(await res.text());
      if (grid.length < 2) continue;
      const { columns, rows } = gridToList(grid);
      BUILTIN_ICPS.push({ id:'builtin-'+key, name:f.label, meta:f.period+' · from the ICP engagement report', columns, rows, href:f.path });
    } catch(e){ /* a missing file just means that list isn't shown */ }
  }
  return BUILTIN_ICPS;
}
async function loadIcps(){
  const wrap=document.getElementById('icp-lists'); wrap.innerHTML='<div class="empty">Loading…</div>';
  await loadBuiltinIcps();
  const { data, error }=await sb.from(ICP_TABLE).select('*').order('created_at',{ascending:false});
  if (error){ UPLOADED_ICPS=[]; }
  else UPLOADED_ICPS = (data||[]).map(l=>({ id:l.id, name:l.name, meta:`${(l.rows||[]).length} ${(l.rows||[]).length===1?'entry':'entries'} · added ${fmtDate((l.created_at||'').slice(0,10))}${l.created_by?' · '+l.created_by:''}`, columns:l.columns||((l.rows&&l.rows[0])?Object.keys(l.rows[0]):[]), rows:l.rows||[], uploaded:true }));
  ICP_DATA={}; [...BUILTIN_ICPS, ...UPLOADED_ICPS].forEach(l=>{ ICP_DATA[l.id]=l; });
  renderIcpLists(error);
}
function renderIcpLists(error){
  const wrap=document.getElementById('icp-lists');
  const q=(document.getElementById('icp-filter').value||'').trim().toLowerCase();
  const match=(l,r)=> !q || l.columns.some(c=>String(r[c]||'').toLowerCase().includes(q));
  const lists=[...(BUILTIN_ICPS||[]), ...UPLOADED_ICPS];
  if(!lists.length){ wrap.innerHTML=`<div class="empty">No ICP lists yet. Click <strong>+ Upload ICP CSV</strong> to add one.</div>`; return; }
  wrap.innerHTML = (error?`<div class="hint">Couldn't load uploaded ICP lists: ${esc(error.message)}. The built-in lists below still work.</div>`:'')
    + lists.map(l=>{
    const rows=l.rows.filter(r=>match(l,r));
    const head=l.columns.map(c=>`<th>${esc(c.replace(/_/g,' '))}</th>`).join('');
    const body=rows.slice(0,500).map(r=>'<tr>'+l.columns.map(c=>`<td>${esc(r[c])}</td>`).join('')+'</tr>').join('')
      || `<tr><td colspan="${l.columns.length}"><div class="empty">Nothing matches “${esc(q)}”.</div></td></tr>`;
    const more = rows.length>500 ? `<div class="empty">Showing the first 500 of ${fmtFull(rows.length)} matching rows — download the CSV for the rest.</div>` : '';
    const count = q ? `${fmtFull(rows.length)} of ${fmtFull(l.rows.length)} matching` : `${fmtFull(l.rows.length)} ${l.rows.length===1?'entry':'entries'}`;
    const del = l.uploaded ? `<button class="btn danger" onclick="deleteIcp('${l.id}')">Delete</button>` : '';
    return `<div class="icp-list-card">
      <div class="icp-list-head">
        <div><div class="icp-list-name">${esc(l.name)}</div><div class="icp-list-meta">${count}${l.uploaded?' · '+esc(l.meta):' · '+esc(l.meta)}</div></div>
        <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
          <button class="btn" style="padding:5px 12px;font-size:12px" onclick="downloadIcpCsv('${l.id}')">↓ Download CSV</button>${del}
        </div>
      </div>
      <div class="table-wrap icp-scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${more}
    </div>`;
  }).join('');
}
async function handleIcpUpload(e){
  const file=e.target.files[0]; e.target.value=''; if(!file)return;
  const statusEl=document.getElementById('icp-status'); statusEl.textContent='Reading '+file.name+'…';
  try {
    const grid=parseCSV(await file.text());
    if (grid.length<2){ statusEl.textContent='That CSV looks empty.'; return; }
    const { columns, rows } = gridToList(grid);
    const name=(file.name.replace(/\.csv$/i,'')||'ICP list').trim();
    const { data:{ user } }=await sb.auth.getUser();
    const { error }=await sb.from(ICP_TABLE).insert({ name, columns, rows, created_by:user?.email||null });
    if (error) throw error;
    statusEl.textContent='Uploaded "'+name+'" ('+rows.length+' rows).'; loadIcps();
  } catch(err){ statusEl.textContent='Upload failed: '+err.message; }
}
function csvCell(v){ v = v==null?'':String(v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadIcpCsv(id){
  const list=ICP_DATA[id]; if(!list){ alert('Could not find that list to download.'); return; }
  const lines=[list.columns.map(csvCell).join(',')].concat(list.rows.map(r=>list.columns.map(c=>csvCell(r[c])).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=((list.name||'icp-list').replace(/[^\w.-]+/g,'_'))+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
async function deleteIcp(id){ if(!confirm('Delete this ICP list?'))return; const { error }=await sb.from(ICP_TABLE).delete().eq('id',id); if(error){alert('Delete failed: '+error.message);return;} loadIcps(); }

// ── LOAD / BOOT ───────────────────────────────────────────────────
function loadData(){
  const btn=document.getElementById('refresh-btn'); btn.disabled=true;
  setStatus('Loading dashboard data…','loading');
  try {
    const latest = PEOPLE.mathias.reports[0];
    setStatus('');
    document.getElementById('last-updated').textContent = 'Data through ' + fmtDate(latest.end);
    document.getElementById('footer-date').textContent =
      'Netlify Content Performance Dashboard · Powered by Virio · LinkedIn data through ' + fmtDate(latest.end);
    renderTabNav();
    switchTab(activeTab);
  } catch(e){ setStatus('Failed to load: '+e.message,'error'); }
  finally { btn.disabled=false; }
}
async function boot(){
  const { data:{ session } }=await sb.auth.getSession();
  if (session && handleValidSession(session)) loadData(); else showAuthScreen(true);
  sb.auth.onAuthStateChange((_e, sess)=>{ if(sess&&handleValidSession(sess)) loadData(); else if(!sess) showAuthScreen(true); });
}
boot();
</script>
